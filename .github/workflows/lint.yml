name: PowerShell Lint (PSScriptAnalyzer)

on:
  push:
    paths:
      - '**.ps1'
  pull_request:
    paths:
      - '**.ps1'
  workflow_dispatch:

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install & run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error
          if ($results) {
              $results | Format-Table -AutoSize | Out-String -Width 300
              # Fail only on parse/syntax errors
              if ($results | Where-Object { $_.Severity -eq 'Error' }) {
                  Write-Error "PSScriptAnalyzer found syntax errors."
                  exit 1
              }
          } else {
              Write-Host "PSScriptAnalyzer: no issues found."
          }
